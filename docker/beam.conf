# Apache site for the beam Docker image. TLS is terminated by the reverse proxy
# in front (Caddy), which forwards plain HTTP with X-Forwarded-Proto: https.
ServerName localhost
ServerTokens Prod
ServerSignature Off
# Listens on 8080 (ports.conf, set in the Dockerfile): non-root cannot bind :80.


<VirtualHost *:8080>
    DocumentRoot /var/www/beam/public

    <Directory /var/www/beam/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Let PHP see $_SERVER['HTTPS']='on' for proxied HTTPS requests. (mod_rewrite's
    # %{HTTPS} is not affected; .htaccess checks X-Forwarded-Proto itself.)
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    ErrorLog ${APACHE_LOG_DIR}/error.log
    # health.php carries the probe key in its query string: keep it out of the log.
    SetEnvIf Request_URI "^/api/health\.php" nolog
    CustomLog ${APACHE_LOG_DIR}/access.log combined env=!nolog
</VirtualHost>

# Sized for a 256 MB container. Measured under the suite and held long-polls:
# ~19 MB RSS per worker, but only ~1-3 MB of it private (PSS ~3 MB); 64 workers
# holding agent long-polls used ~96 MB of cgroup memory, 120 used ~163 MB.
# mcp.php's receive holds 2 workers (itself + its loopback to agent.php) for up
# to ~25 s, so 64 workers allow ~30 concurrent MCP receives.
<IfModule mpm_prefork_module>
    StartServers             4
    MinSpareServers          4
    MaxSpareServers         12
    ServerLimit             64
    MaxRequestWorkers       64
    MaxConnectionsPerChild 1000
</IfModule>
