; beam hardening, layered on php.ini-production (conf.d/zz-beam.ini).
expose_php = Off
allow_url_include = Off
; Nothing fetches URLs via file wrappers (php://input is unaffected); mcp.php uses curl.
allow_url_fopen = Off
; curl_* stay enabled: mcp.php's loopback to agent.php uses curl.
disable_functions = exec,shell_exec,system,passthru,proc_open,popen,pcntl_exec
open_basedir = /var/www/beam/public:/var/www/beam/beamtm_data:/tmp
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
; relay.php accepts up to 7 MB (RELAY_MAX_BYTES) as the raw request body.
post_max_size = 10M
upload_max_filesize = 10M
